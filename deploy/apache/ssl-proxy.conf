# HTTPS vhost of monitor.ikelyane.com → the Next.js server on 127.0.0.1:3020.
# Installed as /etc/apache2/conf.d/userdata/ssl/2_4/ikelyane/monitor.ikelyane.com/proxy.conf
# (cPanel includes it inside its own VirtualHost; survives rebuildhttpdconf).

# ── Real client address ──────────────────────────────────────────────────────────────────────────
# Traffic arrives through Cloudflare. Trust CF-Connecting-IP ONLY from Cloudflare's published ranges
# (https://www.cloudflare.com/ips/): anyone reaching this server directly could otherwise send the header
# and pick the address the app uses for sign-in throttling and the audit log. mod_proxy then appends that
# address as the LAST X-Forwarded-For entry, which is the one the app reads (AUTH_TRUST_PROXY_HEADERS).
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18
RemoteIPTrustedProxy 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17
RemoteIPTrustedProxy 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32
RemoteIPTrustedProxy 2a06:98c0::/29 2c0f:f248::/32

# ── Reverse proxy ────────────────────────────────────────────────────────────────────────────────
ProxyRequests Off
# The app checks the Origin of Server Actions against the Host: keep the public host name.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
# An incoming X-Forwarded-Host could make the app believe it is served under another name.
RequestHeader unset X-Forwarded-Host
ProxyTimeout 60
# cPanel's AutoSSL validation files must still be served by Apache from the document root.
ProxyPass /.well-known/ !
ProxyPass / http://127.0.0.1:3020/ retry=0
ProxyPassReverse / http://127.0.0.1:3020/

# ── Headers (the app already sets nosniff, X-Frame-Options DENY and Referrer-Policy) ─────────────
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
Header always unset X-Powered-By
