# Plain-http vhost of monitor.ikelyane.com: everything goes to HTTPS, except cPanel's AutoSSL
# domain-validation files (/.well-known/…), which must stay reachable over http.
# Installed as /etc/apache2/conf.d/userdata/std/2_4/ikelyane/monitor.ikelyane.com/redirect.conf
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://monitor.ikelyane.com%{REQUEST_URI} [L,R=301]
